<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scent of M | PRO DESIGN v2</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        gold: '#C9A96A',
        dark: '#0f0f0f'
      }
    }
  }
}
</script>

<style>
body {
  background: radial-gradient(circle at top, #1a1a1a, #0f0f0f);
  color: white;
  font-family:
.card {
  transition: 0.3s;
  backdrop-filter: blur(10px);
}

.card:hover {
  transform: translateY(-6px);
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="flex justify-between items-center p-5 border-b border-gold/30">
  <h1 class="text-gold text-2xl font-bold tracking-widest">SCENT OF M</h1>

  <button onclick="toggleCart()" class="bg-gold text-black px-4 py-1 rounded-full">
    Cart (<span id="count">0</span>)
  </button>
</header>

<!-- HERO -->
<section class="text-center py-16">
  <h2 class="text-4xl md:text-5xl text-gold font-light">Luxury Coffee Experience</h2>
  <p class="text-gray-400 mt-2">PRO DESIGN v2</p>
</section>

<!-- PRODUCTS -->
<section id="products" class="grid grid-cols-1 md:grid-cols-3 gap-6 p-6"></section>

<!-- CART -->
<div id="cart" class="fixed right-0 top-0 w-80 h-full bg-black border-l border-gold p-4 hidden">
  <h2 class="text-gold text-lg mb-4">Your Cart</h2>
